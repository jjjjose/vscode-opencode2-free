<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="OpenCode Free">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182238"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Fondo redondeado oscuro -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Halo del símbolo -->
  <path d="M 64 64 C 52 40 24 40 24 64 C 24 88 52 88 64 64 C 76 40 104 40 104 64 C 104 88 76 88 64 64 Z"
        fill="none" stroke="url(#mark)" stroke-width="13" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>

  <!-- Infinito: modelos gratis, sin límite -->
  <path d="M 64 64 C 52 40 24 40 24 64 C 24 88 52 88 64 64 C 76 40 104 40 104 64 C 104 88 76 88 64 64 Z"
        fill="none" stroke="url(#mark)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
